name: Build Potok release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  POTOK_VERSION: v0.1.2

concurrency:
  group: potok-release

jobs:
  windows-storage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
      - name: Verify concurrent access to partial files
        run: go test github.com/anacrolix/torrent/storage -run '^(TestClassicFileIoFailedRenameKeepsCachedWriter|TestClassicWritesDuringMarkNotComplete)$' -v

  release:
    needs: windows-storage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
      - name: Check the application
        run: go test ./...
      - name: Package Windows and Linux builds
        env:
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in windows linux; do
            export GOOS="$target"
            bundle="potok-${POTOK_VERSION}-${target}-x64"
            mkdir "dist/$bundle"
            destination="$PWD/dist/$bundle"
            executable=potok
            if [[ "$target" == windows ]]; then executable=Potok.exe; fi
            go build -trimpath -o "$destination/$executable" .
            cp README.md "$destination/"
            license_dir="$destination/third-party"
            mkdir -p "$license_dir/go"
            cp "$(go env GOROOT)/LICENSE" "$(go env GOROOT)/PATENTS" "$license_dir/go/"
            go list -deps -f '{{with .Module}}{{if not .Main}}{{.Path}}{{"\t"}}{{.Dir}}{{end}}{{end}}' . |
              sort -u | while IFS=$'\t' read -r module source; do
                [[ -n "$module" ]] || continue
                mkdir -p "$license_dir/$module"
                find "$source" -maxdepth 1 -type f \( -iname 'license*' -o -iname 'copying*' -o -iname 'notice*' -o -iname 'patents*' \) \
                  -exec cp -t "$license_dir/$module" {} +
              done
            (cd dist && zip -q -r "$bundle.zip" "$bundle")
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$POTOK_VERSION" >/dev/null 2>&1; then
            echo "Release $POTOK_VERSION already exists."
            exit 0
          fi
          gh release create "$POTOK_VERSION" dist/*.zip --target "$GITHUB_SHA" \
            --title "Поток ${POTOK_VERSION#v}" \
            --notes "Раздача частей файла отключена во время и после скачивания. Для обновления закройте запущенный клиент и запустите новый исполняемый файл с той же папкой загрузок и настроек."
